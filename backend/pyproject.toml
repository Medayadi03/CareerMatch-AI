[project]
name = "careermatch-backend"
version = "0.1.0"
description = "CareerMatch AI foundation API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.121.2",
  "pydantic==2.12.4",
  "pydantic-settings==2.12.0",
  "pymupdf==1.26.7",
  "uvicorn==0.38.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.0.1", "ruff==0.14.5", "mypy==1.18.2"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
